name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单元测试 + Debug 编译
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # secrets 不能直接写进 step 的 if（求值顺序在 secrets 之前），
    # 所以先在 job 级算出「有没有密钥」，后面的步骤靠它决定跑不跑。
    env:
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 先出 Debug 包：验签用例需要真实签名的 APK 作为样本，
      # 没有样本它们会 assumeTrue 跳过——跳过不算失败，但会掩盖问题。
      - name: 编译 Debug 包
        run: ./gradlew :app:assembleDebug --console=plain

      # Xposed 模块默认不参与构建，但它的编译错误 CI 必须能看到：
      # 回传链路（RelayProvider + GuardHook）是 3.2.2 重做的，没这一步等于没有回归网。
      - name: 编译 Xposed 模块
        run: ./gradlew -PenableXposed :xposed:assembleDebug --console=plain

      # 扩展端口发现范围与桌面服务默认端口必须一致（3.2.0 就是这里写错导致默认连不上）
      - name: 端口一致性静态检查（扩展 vs 服务）
        run: python3 scripts/check-bridge-ports.py

      # 主 App 与 Xposed 模块两侧的已知宿主包名列表必须一致（确认回执按包名定向，
      # 两侧不同步会出现「模块放行了宿主、主 App 却拒绝回执」的静默断裂）
      - name: 宿主列表一致性静态检查（主 App vs 模块）
        run: python3 scripts/check-host-packages.py

      - name: 执行 JVM 单元测试
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      # Gradle 里「一个用例都没跑到」也会是 BUILD SUCCESSFUL（比如测试源集被改坏），
      # 所以这里直接读 JUnit XML，用例数为 0 或少得不正常就判失败。
      - name: 校验测试确实执行了
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys
          import xml.etree.ElementTree as ET

          total = failed = skipped = 0
          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failed += int(root.get("failures", 0)) + int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          print(f"测试类 {len(files)} 个，用例 {total} 个，失败 {failed} 个，跳过 {skipped} 个")
          if total < 90:
              sys.exit(f"只跑到 {total} 个用例（预期 ≥90），判定为测试没有真正执行")
          if failed:
              sys.exit(f"{failed} 个用例失败")
          # 「零跳过」不能只写在 README 里。CI 先跑 assembleDebug，验签用例一定有样本；
          # 这里要是出现 skipped，说明样本没生成或有人加了 assumeTrue 兜底，直接红。
          if skipped:
              sys.exit(f"{skipped} 个用例被跳过，CI 不允许跳过")
          PY

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore

      # 发布密钥放在仓库 Secrets 里（base64），有就恢复出来。
      # 这样 CI 能顺带验证「正式签名包能构建」，维护者也不必在本地装 Android SDK。
      # 没有 Secrets 时跳过，后面出的包是 debug 签名——CI 不出 Release，不影响用户。
      - name: 恢复发布密钥
        if: env.HAS_ANDROID_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "已恢复发布密钥"

      # 正式签名包：只用于验证「签名配置没坏」+ 给维护者一个可直接下载的产物。
      - name: 构建正式签名包
        if: env.HAS_ANDROID_KEY == 'true'
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 核对签名证书
        if: env.HAS_ANDROID_KEY == 'true'
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          # apksigner 不在 ubuntu runner 的 PATH 里，只在 SDK 的 build-tools 下，
          # 所以要自己找。找不到就直接失败，不能跳过核对。
          APKSIGNER=$(command -v apksigner || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "找不到 apksigner，无法核对签名" >&2
            exit 1
          fi
          echo "使用 $APKSIGNER"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep 'certificate DN')
          echo "$CERT"
          case "$CERT" in
            *"CN=DownloadGuard"*) echo "签名证书正确" ;;
            *) echo "签名证书不是发布密钥：$CERT" >&2; exit 1 ;;
          esac

      - name: 上传正式签名包
        if: env.HAS_ANDROID_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error

  desktop:
    name: 桌面版编译 + 自检 + 端到端（JDK ${{ matrix.jdk }}）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 传输中断的底层文案随 JDK 变化（JDK 17 返回 -1、JDK 25 抛 Premature EOF），
    # 只在 17 上跑会漏掉回归，两个版本都跑
    strategy:
      fail-fast: false
      matrix:
        jdk: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      # 扩展的端口发现范围必须覆盖服务的默认端口与顺延窗口（3.2.0 就是这里写错导致默认连不上）
      - name: 端口一致性静态检查（扩展 vs 服务）
        run: python3 scripts/check-bridge-ports.py

      # 桌面版零依赖：javac + jar，不经过 Gradle，也不需要联网
      - name: 编译 jar
        run: cd desktop && ./build.sh

      # 「可复现」不能只写在 README 里。同一份源码连打两次，字节必须一致，
      # 否则 Release 上的 CHECKSUMS.txt 对用户没有意义（他下到的包算不出那个哈希）。
      - name: 可复现构建（两次构建字节一致）
        run: |
          set -euo pipefail
          sha256sum dist/DownloadGuard-Desktop-*.jar > /tmp/hash1.txt
          cat /tmp/hash1.txt
          ( cd desktop && ./build.sh > /dev/null )
          sha256sum dist/DownloadGuard-Desktop-*.jar > /tmp/hash2.txt
          cat /tmp/hash2.txt
          if ! diff /tmp/hash1.txt /tmp/hash2.txt; then
            echo "两次构建的 jar 哈希不一致：build.sh 里的 mtime 或条目顺序没有固定"
            exit 1
          fi

      # 必须提供真实签名 APK 样本；skipped 不是「通过」，出现跳过就判红
      - name: 内置自检（真实 APK 验签，0 跳过）
        run: |
          set -o pipefail
          java -Ddg.apk=desktop/test/fixtures/signed.apk \
            -jar dist/DownloadGuard-Desktop-*.jar --selftest | tee /tmp/selftest.log
          grep -q '0 跳过' /tmp/selftest.log || { echo "自检出现跳过用例"; exit 1; }

      # 下载完整性这类问题单测覆盖不到：起真服务器、真下、真杀进程
      - name: 下载完整性端到端测试（100 项检查）
        run: python3 desktop/test/e2e.py

      # 光编译过不算数：真启动、带令牌请求、真下载一次并核对 SHA-256
      - name: 启动 + 真实下载烟雾测试
        run: |
          set -euo pipefail
          HOME_DIR=/tmp/dg-home
          OUT=/tmp/dg-out
          SRC=/tmp/dg-src
          rm -rf "$HOME_DIR" "$OUT" "$SRC"
          mkdir -p "$OUT" "$SRC"
          head -c 1048576 /dev/urandom > "$SRC/smoke.bin"
          (cd "$SRC" && exec python3 -m http.server 8898 --bind 127.0.0.1 >/dev/null 2>&1) &
          SRV_PID=$!
          java -jar dist/DownloadGuard-Desktop-*.jar --port 8899 --no-browser \
            --home "$HOME_DIR" --dir "$OUT" > /tmp/dg.log 2>&1 &
          APP_PID=$!
          cleanup() { kill "$APP_PID" "$SRV_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          TOKEN=""
          for i in $(seq 1 40); do
            TOKEN=$(grep '^token=' "$HOME_DIR/instance.port" 2>/dev/null | cut -d= -f2 || true)
            if [ -n "$TOKEN" ] && curl -sf -H "X-DG-Token: $TOKEN" http://127.0.0.1:8899/api/version > /tmp/ver.json; then
              break
            fi
            sleep 0.5
          done
          cat /tmp/ver.json || true
          [ -n "$TOKEN" ] || { echo "没有读到访问令牌"; cat /tmp/dg.log; exit 1; }
          # 版本号从 Engine.VERSION 取，不硬编码：发版不再需要改 CI
          EXPECT_VERSION=$(grep -oP 'VERSION = "\K[0-9.]+' desktop/src/main/java/com/dlguard/desktop/Engine.java)
          grep -q "\"$EXPECT_VERSION\"" /tmp/ver.json || { echo "版本号与 Engine.VERSION 不一致"; cat /tmp/ver.json; exit 1; }

          # 无令牌必须 403，带 Cookie 才能打开页面
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8899/)" = "403" ]
          curl -sf -H "Cookie: dg_token=$TOKEN" http://127.0.0.1:8899/ | grep -q 'DownloadGuard'

          curl -sf -X POST http://127.0.0.1:8899/api/tasks \
            -H "X-DG-Token: $TOKEN" -H 'Content-Type: application/json' \
            -d '{"url":"http://127.0.0.1:8898/smoke.bin","connections":4}' > /tmp/task.json
          cat /tmp/task.json
          python3 - <<'PY'
          import json, time, urllib.request
          token = ""
          for line in open("/tmp/dg-home/instance.port", encoding="utf-8"):
              if line.startswith("token="):
                  token = line.split("=", 1)[1].strip()
          tid = json.load(open("/tmp/task.json"))["ids"][0]
          for _ in range(60):
              req = urllib.request.Request("http://127.0.0.1:8899/api/state",
                                           headers={"X-DG-Token": token})
              tasks = json.load(urllib.request.urlopen(req))["tasks"]
              t = next(x for x in tasks if x["id"] == tid)
              if t["status"] in ("completed", "error"):
                  break
              time.sleep(0.5)
          assert t["status"] == "completed", t
          print("下载完成：", t["name"], t["size"])
          PY
          cmp "$SRC/smoke.bin" "$OUT/smoke.bin"
          sha256sum "$SRC/smoke.bin" "$OUT/smoke.bin"
