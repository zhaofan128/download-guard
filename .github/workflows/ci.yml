name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单元测试 + Debug 编译
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 先出 Debug 包：验签用例需要真实签名的 APK 作为样本，
      # 没有样本它们会 assumeTrue 跳过——跳过不算失败，但会掩盖问题。
      - name: 编译 Debug 包
        run: ./gradlew :app:assembleDebug --console=plain

      - name: 执行 JVM 单元测试
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      # Gradle 里「一个用例都没跑到」也会是 BUILD SUCCESSFUL（比如测试源集被改坏），
      # 所以这里直接读 JUnit XML，用例数为 0 或少得不正常就判失败。
      - name: 校验测试确实执行了
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys
          import xml.etree.ElementTree as ET

          total = failed = skipped = 0
          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failed += int(root.get("failures", 0)) + int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          print(f"测试类 {len(files)} 个，用例 {total} 个，失败 {failed} 个，跳过 {skipped} 个")
          if total < 90:
              sys.exit(f"只跑到 {total} 个用例（预期 ≥90），判定为测试没有真正执行")
          if failed:
              sys.exit(f"{failed} 个用例失败")
          # 「零跳过」不能只写在 README 里。CI 先跑 assembleDebug，验签用例一定有样本；
          # 这里要是出现 skipped，说明样本没生成或有人加了 assumeTrue 兜底，直接红。
          if skipped:
              sys.exit(f"{skipped} 个用例被跳过，CI 不允许跳过")
          PY

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore

  desktop:
    name: 桌面版编译 + 自检 + 端到端
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 桌面版零依赖：javac + jar，不经过 Gradle，也不需要联网
      - name: 编译 jar
        run: cd desktop && ./build.sh

      # 「可复现」不能只写在 README 里。同一份源码连打两次，字节必须一致，
      # 否则 Release 上的 CHECKSUMS.txt 对用户没有意义（他下到的包算不出那个哈希）。
      - name: 可复现构建（两次构建字节一致）
        run: |
          set -euo pipefail
          sha256sum dist/DownloadGuard-Desktop-*.jar > /tmp/hash1.txt
          cat /tmp/hash1.txt
          ( cd desktop && ./build.sh > /dev/null )
          sha256sum dist/DownloadGuard-Desktop-*.jar > /tmp/hash2.txt
          cat /tmp/hash2.txt
          if ! diff /tmp/hash1.txt /tmp/hash2.txt; then
            echo "两次构建的 jar 哈希不一致：build.sh 里的 mtime 或条目顺序没有固定"
            exit 1
          fi

      # 必须提供真实签名 APK 样本；skipped 不是「通过」，出现跳过就判红
      - name: 内置自检（真实 APK 验签，0 跳过）
        run: |
          set -o pipefail
          java -Ddg.apk=desktop/test/fixtures/signed.apk \
            -jar dist/DownloadGuard-Desktop-3.1.1.jar --selftest | tee /tmp/selftest.log
          grep -q '0 跳过' /tmp/selftest.log || { echo "自检出现跳过用例"; exit 1; }

      # 下载完整性这类问题单测覆盖不到：起真服务器、真下、真杀进程
      - name: 下载完整性端到端测试（76 项检查）
        run: python3 desktop/test/e2e.py

      # 光编译过不算数：真启动、带令牌请求、真下载一次并核对 SHA-256
      - name: 启动 + 真实下载烟雾测试
        run: |
          set -euo pipefail
          HOME_DIR=/tmp/dg-home
          OUT=/tmp/dg-out
          SRC=/tmp/dg-src
          rm -rf "$HOME_DIR" "$OUT" "$SRC"
          mkdir -p "$OUT" "$SRC"
          head -c 1048576 /dev/urandom > "$SRC/smoke.bin"
          (cd "$SRC" && exec python3 -m http.server 8898 --bind 127.0.0.1 >/dev/null 2>&1) &
          SRV_PID=$!
          java -jar dist/DownloadGuard-Desktop-3.1.1.jar --port 8899 --no-browser \
            --home "$HOME_DIR" --dir "$OUT" > /tmp/dg.log 2>&1 &
          APP_PID=$!
          cleanup() { kill "$APP_PID" "$SRV_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          TOKEN=""
          for i in $(seq 1 40); do
            TOKEN=$(grep '^token=' "$HOME_DIR/instance.port" 2>/dev/null | cut -d= -f2 || true)
            if [ -n "$TOKEN" ] && curl -sf -H "X-DG-Token: $TOKEN" http://127.0.0.1:8899/api/version > /tmp/ver.json; then
              break
            fi
            sleep 0.5
          done
          cat /tmp/ver.json || true
          [ -n "$TOKEN" ] || { echo "没有读到访问令牌"; cat /tmp/dg.log; exit 1; }
          grep -q '3.1.1' /tmp/ver.json

          # 无令牌必须 403，带 Cookie 才能打开页面
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8899/)" = "403" ]
          curl -sf -H "Cookie: dg_token=$TOKEN" http://127.0.0.1:8899/ | grep -q 'DownloadGuard'

          curl -sf -X POST http://127.0.0.1:8899/api/tasks \
            -H "X-DG-Token: $TOKEN" -H 'Content-Type: application/json' \
            -d '{"url":"http://127.0.0.1:8898/smoke.bin","connections":4}' > /tmp/task.json
          cat /tmp/task.json
          python3 - <<'PY'
          import json, time, urllib.request
          token = ""
          for line in open("/tmp/dg-home/instance.port", encoding="utf-8"):
              if line.startswith("token="):
                  token = line.split("=", 1)[1].strip()
          tid = json.load(open("/tmp/task.json"))["ids"][0]
          for _ in range(60):
              req = urllib.request.Request("http://127.0.0.1:8899/api/state",
                                           headers={"X-DG-Token": token})
              tasks = json.load(urllib.request.urlopen(req))["tasks"]
              t = next(x for x in tasks if x["id"] == tid)
              if t["status"] in ("completed", "error"):
                  break
              time.sleep(0.5)
          assert t["status"] == "completed", t
          print("下载完成：", t["name"], t["size"])
          PY
          cmp "$SRC/smoke.bin" "$OUT/smoke.bin"
          sha256sum "$SRC/smoke.bin" "$OUT/smoke.bin"
